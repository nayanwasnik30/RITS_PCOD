<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — Pulse</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', sans-serif;
    background: linear-gradient(145deg, #8D3B5A, #24594c);
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 20px;
  }
  .card {
    background: #FFFCFD;
    width: min(100%, 400px);
    border-radius: 24px;
    padding: 30px;
    box-shadow: 0 22px 60px rgba(0,0,0,.25);
    text-align: center;
  }
  .card h1 {
    font-size: 24px;
    margin: 16px 0 8px;
    color: #3F2734;
  }
  .card p {
    color: #806272;
    font-size: 14px;
    margin-bottom: 20px;
    line-height: 1.5;
  }
  label {
    display: block;
    text-align: left;
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    color: #806272;
    margin-bottom: 6px;
    letter-spacing: .05em;
  }
  input {
    width: 100%;
    border: 1px solid #F0D6E1;
    border-radius: 10px;
    padding: 12px;
    font: 14px 'Inter', sans-serif;
    margin-bottom: 14px;
  }
  button {
    width: 100%;
    border: 0;
    border-radius: 10px;
    padding: 12px;
    background: #C85F87;
    color: #fff;
    font: 600 14px 'Inter', sans-serif;
    cursor: pointer;
  }
  button:disabled {
    opacity: .6;
    cursor: not-allowed;
  }
  .error {
    background: #FBE7E2;
    color: #C6576E;
    padding: 8px 12px;
    border-radius: 8px;
    font-size: 12px;
    margin-bottom: 12px;
    display: none;
  }
  .success {
    background: #D4EDDA;
    color: #155724;
    padding: 8px 12px;
    border-radius: 8px;
    font-size: 12px;
    margin-bottom: 12px;
    display: none;
  }
  .loading {
    color: #806272;
    font-size: 14px;
  }
  a { color: #C85F87; text-decoration: none; }
</style>
</head>
<body>
<div class="card">
  <div style="width:48px;height:48px;margin:0 auto;display:grid;place-items:center;border-radius:14px;background:#C85F87;color:#fff;font-size:26px;">P</div>
  <h1>Reset Password</h1>
  <p>Enter your new password below.</p>

  <div id="loadingMsg" class="loading">Verifying reset link…</div>
  <div id="errorMsg" class="error"></div>
  <div id="successMsg" class="success"></div>

  <form id="resetForm" style="display:none;">
    <label for="newPassword">New Password</label>
    <input id="newPassword" type="password" placeholder="••••••••" required minlength="6">
    <label for="confirmPassword">Confirm Password</label>
    <input id="confirmPassword" type="password" placeholder="••••••••" required minlength="6">
    <button type="submit" id="resetBtn">Set New Password</button>
  </form>

  <p style="margin-top:16px;font-size:12px;"><a href="wellness-tracker.html">← Back to Pulse</a></p>
</div>

<script>
const SUPABASE_URL = 'https://ujkupyimtbqzkusiefyb.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVqa3VweWltdGJxemt1c2llZnliIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgxMTEzNDMsImV4cCI6MjEwMzY4NzM0M30.rfJEm7yu0dxuVRkYjNwikeeN7MrhKHAJW_S_Kw9TWnU';
const sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

function showError(msg) {
  document.getElementById('errorMsg').textContent = msg;
  document.getElementById('errorMsg').style.display = 'block';
}
function showSuccess(msg) {
  document.getElementById('successMsg').textContent = msg;
  document.getElementById('successMsg').style.display = 'block';
}

// Supabase sends the token as URL hash: #access_token=...&type=recovery
const hash = window.location.hash;
const params = new URLSearchParams(hash.substring(1));
const accessToken = params.get('access_token');
const type = params.get('type');

if (type === 'recovery' && accessToken) {
  // Set the session with the recovery token
  sbClient.auth.setSession({
    access_token: accessToken,
    refresh_token: params.get('refresh_token') || ''
  }).then(({ error }) => {
    if (error) {
      document.getElementById('loadingMsg').style.display = 'none';
      showError('Invalid or expired reset link. Please request a new one.');
    } else {
      document.getElementById('loadingMsg').style.display = 'none';
      document.getElementById('resetForm').style.display = 'block';
    }
  });
} else {
  document.getElementById('loadingMsg').style.display = 'none';
  showError('Invalid reset link. Please check your email and try again.');
}

document.getElementById('resetForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const pw = document.getElementById('newPassword').value;
  const confirm = document.getElementById('confirmPassword').value;

  if (pw.length < 6) {
    showError('Password must be at least 6 characters.');
    return;
  }
  if (pw !== confirm) {
    showError('Passwords do not match.');
    return;
  }

  document.getElementById('resetBtn').disabled = true;
  document.getElementById('resetBtn').textContent = 'Updating…';

  const { error } = await sbClient.auth.updateUser({ password: pw });

  if (error) {
    showError(error.message);
    document.getElementById('resetBtn').disabled = false;
    document.getElementById('resetBtn').textContent = 'Set New Password';
  } else {
    document.getElementById('resetForm').style.display = 'none';
    showSuccess('Password updated! Redirecting to login…');
    setTimeout(() => { window.location.href = 'wellness-tracker.html'; }, 2000);
  }
});
</script>
</body>
</html>
